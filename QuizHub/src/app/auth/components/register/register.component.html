<div class="container">
    <h1 class="text-6xl m-0 mb-4">Rejestracja</h1>
    <div class="auth-data-input-box" [formGroup]="registerFormGroup">
        <p-floatLabel class="mb-4">
            <input id="username" type="text" pInputText class="auth-data-input" formControlName="username"/>
            <label for="username">Nazwa użytkownika</label>
        </p-floatLabel>

        <p-floatLabel class="mb-4">
            <p-password id="password" [toggleMask]="true" [feedback]="false" [style]="{'width':'500px'}" [inputStyle]="{'width':'500px'}" formControlName="password"/>
            <label for="password" class="auth-data-input">Hasło</label>
        </p-floatLabel>

        <p-floatLabel class="mb-4">
            <p-password id="password" [toggleMask]="true" [feedback]="false" [style]="{'width':'500px'}" [inputStyle]="{'width':'500px'}" formControlName="confirmPassword"/>
            <label for="password" class="auth-data-input">Powtórz hasło</label>
        </p-floatLabel>

        <p-button label="Zarejestruj się" [outlined]="true" [disabled]="registerFormGroup.invalid" [loading]="registerButttonLoading" (click)="register()" class="my-4"/>

        <a routerLink="../login" class="mt-4">Masz już konto? Zaloguj się</a>
    </div>
</div>
