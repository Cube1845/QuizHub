<div class="container">
    <div class="nav-bar-items">
        @for (navBarItem of navBarItems; track $index) {
            <div class="nav-bar-item" (click)="navigateTo(navBarItem.route, $index)" [ngStyle]="{'background': navBarItem.color}">
                <i [class]="navBarItem.icon"></i>{{ navBarItem.text }}
            </div>
        }
    </div>
    <p-divider layout="vertical" />
</div>
