<p-toast position="bottom-left" [life]="3000" />
<p-confirmDialog></p-confirmDialog>
@for (questionBase of questionBases; track $index) {
    <div class="question-base-panel contains-delete-button" (click)="this.router.navigateByUrl('manager/question-base-edit/' + questionBase.id)">
        <h1>{{ questionBase.name }}</h1>
        <p>{{ questionBase.questionCount }} {{ this.polishWordVariationService.getQuestionWordVariation(questionBase.questionCount) }}</p>

        <i class="pi pi-pencil clickable-icon edit-icon" (click)="displayQuestionBaseNameEditDialog($event, $index)"></i>
        <i class="pi pi-trash clickable-icon delete-icon" (click)="displayQuestionBaseRemovalModal($event, $index)"></i>
    </div>
}

<div class="question-base-panel" (click)="dialogVisible = true">
    <i class="pi pi-plus" style="font-size: 1.5rem; color: var(--p-zinc-200)"></i>
</div>

<p-dialog [header]="getDialogHeader()" [modal]="true" [visible]="dialogVisible" [closable]="false" [draggable]="false" [resizable]="false" [style]="{ width: '30rem', height: '19rem' }">
    <p-floatLabel>
        <input id="username" type="text" pInputText [style]="{width: '100%'}" [formControl]="nameFormControl" maxlength="25"/>
        <label for="username">Nazwa</label>
    </p-floatLabel>

    @if (currentEditedQuestionBaseIndex < 0) {
        <div class="dialog-buttons-box">
            <p-button label="Anuluj" severity="secondary" [outlined]="true" (click)="dialogVisible = false; nameFormControl.reset()" class="dialog-button"/>
            <p-button label="Utwórz" severity="primary" [outlined]="true" (click)="dialogVisible = false; createQuestionBase(); nameFormControl.reset()" class="dialog-button" [disabled]="nameFormControl.invalid"/>
        </div>
    } @else {
        <div class="dialog-buttons-box">
            <p-button label="Anuluj" severity="secondary" [outlined]="true" (click)="dialogVisible = false; currentEditedQuestionBaseIndex = -1; nameFormControl.reset()" class="dialog-button"/>
            <p-button label="Zapisz" severity="primary" [outlined]="true" (click)="dialogVisible = false; saveQuestionBaseName(); currentEditedQuestionBaseIndex = -1; nameFormControl.reset()" class="dialog-button" [disabled]="nameFormControl.invalid"/>
        </div>
    }
</p-dialog>
