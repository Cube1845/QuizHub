<p-confirmDialog></p-confirmDialog>
@for (questionBase of questionBases; track $index) {
    <div class="question-base-panel contains-delete-button" (click)="this.router.navigateByUrl('manager/question-base-edit/' + questionBase.id)">
        <h1>{{ questionBase.name }}</h1>
        <p>{{ questionBase.questionCount }} {{ this.polishWordVariationService.getQuestionWordVariation(questionBase.questionCount) }}</p>

        <i class="pi pi-trash delete-icon" (click)="displayQuestionBaseRemovalModal($event)"></i>
    </div>
}

<div class="question-base-panel" (click)="dialogVisible = true">
    <i class="pi pi-plus" style="font-size: 6rem;"></i>
</div>

<p-button class="add-question-base-button" (click)="dialogVisible = true">
    <i class="pi pi-plus" style="font-size: 1.5rem; color: var(--text-color)"></i>
</p-button>

<p-dialog header="Dodaj bazę pytań" [modal]="true" [visible]="dialogVisible" [closable]="false" [draggable]="false" [resizable]="false" [style]="{ width: '30rem', height: '16rem' }">
    <p-floatLabel>
        <input id="username" type="text" pInputText [style]="{width: '100%'}" [formControl]="nameFormControl" maxlength="25"/>
        <label for="username">Nazwa</label>
    </p-floatLabel>
    <div class="dialog-buttons-box">
        <p-button label="Anuluj" severity="danger" [outlined]="true" (click)="dialogVisible = false" class="dialog-button"/>
        <p-button label="Utwórz" severity="success" [outlined]="true" (click)="dialogVisible = false; createQuestionBase()" class="dialog-button" [disabled]="nameFormControl.invalid"/>
    </div>
</p-dialog>
