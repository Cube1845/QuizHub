<div [class]="'mt-2 container m-0 p-0 border-round-xl' + getClass()" (mouseover)="hovered = true" (mouseout)="hovered = false" (click)="onAnswerTileClick()">
    @if (answer.image) {
        <img class="m-3 mb-2 mt-4" [src]="answer.image!.displayUrl" style="height: 180px; width: min-content;">
        <h3 class="p-0 mt-0 m-3">{{ answer.content }}</h3>
    } @else {
        <h2 class="py-6 m-3 px-2">{{ answer.content }}</h2>
    }
</div>
